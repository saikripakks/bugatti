<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    * {
    }
    body {
      /* background-color: red; */
      margin: 0;
    }
    .main1 {
      width: 100vw;
      height: 100vh;
      background-color: blueviolet;
    }
    #main1_image {
      width: 100vw;
      height: 100vh;
    }
    .sub11 {
      position: absolute;
      top: 5px;
      right: 5px;
    }
    .sub11 img {
      width: 150px;
    }
    .sub12 {
      position: absolute;
      top: 5px;
      left: 50px;
    }
    .sub12 img {
      width: 200px;
    }
    .sub13 {
      color: beige;
      font-size: x-large;
      position: absolute;
      left: 70px;
      top: 150px;
    }
    .sub13 td {
      padding-bottom: 40px;
    }
    .sub13 td:hover {
      padding-left: 40px;
      color: red;
      opacity: 0.5;
    }
    .sub14 {
      /* background-color: brown; */
      transition: all 1s ease-in-out;
      font-size: 70px;
      text-align: center;
      position: absolute;
      bottom: 5vw;
      left: 20vw;
      color: silver;
      opacity: 0.5;
     
    }
    h1{
         margin: 0;
    }
    .main1:hover .sub14 {
      opacity: 1;
      left:25vw;
    }
    span {
      bottom: 5px;
      color: red;
    }
  </style>
  <body>
    <div class="main1">
      <img
        src="https://images6.alphacoders.com/906/thumb-1920-906689.jpg"
        alt
        id="main1_image"
      />
      <div class="sub11">
        <img
          src="https://www.pngplay.com/wp-content/uploads/13/Bugatti-Logo-Transparent-Image.png"
          alt
        />
      </div>
      <div class="sub12">
        <img src="https://pngimg.com/d/bugatti_PNG99579.png" alt />
      </div>
      <div class="sub13">
        <table>
          <tr>
            <td>Home</td>
          </tr>
          <tr>
            <td>Booking</td>
          </tr>
          <tr>
            <td>Model</td>
          </tr>
          <tr>
            <td>About</td>
          </tr>
        </table>
      </div>
      <div class="sub14">
        <h1>Bugatti <span>Veyron</span></h1>
      </div>
    </div>
  </body>
</html>
